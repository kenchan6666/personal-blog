# Single-VM stack: nginx :80/:443 → Next.js + FastAPI, plus Mongo, Redis, and certbot.
# Preferred: bash deployment/start.sh --prod
# Or: copy deployment/env.example to deployment/.env, then:
#   docker compose -f docker-compose.prod.yml --env-file deployment/.env up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-./deployment/.env}
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: portfolio
      REDIS_URL: redis://redis:6379/0
      AVATAR_DIR: /data/avatars
      AGENT_API_URL: http://agent:8900
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/media:/data/avatars
    depends_on:
      - mongo
      - redis
      - qdrant

  agent:
    build:
      context: .
      dockerfile: viola-agent/Dockerfile
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-./deployment/.env}
    environment:
      BACKEND_API_BASE_URL: http://api:8000
      PORTFOLIO_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
      PORTFOLIO_WRITE_ENABLED: "true"
      VIOLA_API_SERVER_KEY: ${AGENT_INTERNAL_TOKEN}
      VIOLA_MEDIA_TOKEN_SECRET: ${AGENT_INTERNAL_TOKEN}
      VIOLA_AGENTS__DEFAULTS__PROVIDER: uniapi
      VIOLA_AGENTS__DEFAULTS__MODEL: ${VIOLA_AGENT_MODEL:-gemini-2.5-flash}
      VIOLA_AGENTS__DEFAULTS__TIMEZONE: Asia/Hong_Kong
      VIOLA_AGENTS__DEFAULTS__MAX_MESSAGES: "16"
      VIOLA_AGENTS__DEFAULTS__CONTEXT_WINDOW_TOKENS: "32768"
      VIOLA_AGENTS__DEFAULTS__SESSION_TTL_MINUTES: "30"
      VIOLA_TOOLS__PERSISTENCE_VIA_MCP_ONLY: "true"
      VIOLA_CUSTOMER_SERVICE_ONLY: "false"
      VIOLA_OPENAI_COMPAT_TIMEOUT_S: "300"
      VIOLA_STREAM_IDLE_TIMEOUT_S: "180"
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/viola/.viola/portfolio", "--timeout", "600", "--verbose"]
    volumes:
      - agent_data:/home/viola/.viola
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:-https://kenchan0522.blog}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/proxy.inc:/etc/nginx/portfolio/proxy.inc:ro
      - ./deployment/nginx-runtime:/etc/nginx/conf.d
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - while true; do sleep 12h; nginx -s reload; done & exec nginx -g "daemon off;"
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --cert-name site --quiet || true; sleep 12h; done

volumes:
  mongo_data:
  redis_data:
  certbot_www:
  certbot_certs:
  agent_data:
  qdrant_data:
