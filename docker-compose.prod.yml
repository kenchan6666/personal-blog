# Single-VM stack: nginx :80/:443 → Next.js + FastAPI, plus Mongo, Redis, and certbot.
# Preferred on the GCP VM (images are built in GitHub Actions):
#   IMAGE_TAG=<commit-sha> bash deployment/start.sh --prod --pull
# Local / recovery build on the machine:
#   bash deployment/start.sh --prod
# Or: copy deployment/env.example to deployment/.env, then:
#   docker compose -f docker-compose.prod.yml --env-file deployment/.env up -d --build

# IMAGE_REGISTRY default is the private Artifact Registry repo in asia-east2.
# CI and start.sh --pull set IMAGE_TAG to the git SHA.

# Rotate container logs so json-file logs can't fill the data disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ${IMAGE_REGISTRY:-asia-east2-docker.pkg.dev/project-9d21d8d1-183d-4306-8c3/personal-blog}/api:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${DEPLOY_ENV_FILE:-./deployment/.env}
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: portfolio
      REDIS_URL: redis://redis:6379/0
      AVATAR_DIR: /data/avatars
      RESUME_DIR: /data/resumes
      AGENT_API_URL: http://agent:8900
      QDRANT_URL: http://qdrant:6333
    volumes:
      # Host bind mounts (on the data disk) so uploads and generated resume
      # PDFs survive image updates. Backed up by deployment/backup.sh.
      - ./data/media:/data/avatars
      - ./data/resumes:/data/resumes
    depends_on:
      - mongo
      - redis
      - qdrant

  agent:
    image: ${IMAGE_REGISTRY:-asia-east2-docker.pkg.dev/project-9d21d8d1-183d-4306-8c3/personal-blog}/agent:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: viola-agent/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${DEPLOY_ENV_FILE:-./deployment/.env}
    environment:
      BACKEND_API_BASE_URL: http://api:8000
      PORTFOLIO_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
      PORTFOLIO_WRITE_ENABLED: "true"
      VIOLA_API_SERVER_KEY: ${AGENT_INTERNAL_TOKEN}
      VIOLA_MEDIA_TOKEN_SECRET: ${AGENT_INTERNAL_TOKEN}
      VIOLA_AGENTS__DEFAULTS__PROVIDER: uniapi
      VIOLA_AGENTS__DEFAULTS__MODEL: ${VIOLA_AGENT_MODEL:-gemini-2.5-flash}
      VIOLA_AGENTS__DEFAULTS__TIMEZONE: Asia/Hong_Kong
      VIOLA_AGENTS__DEFAULTS__MAX_MESSAGES: "16"
      VIOLA_AGENTS__DEFAULTS__CONTEXT_WINDOW_TOKENS: "32768"
      VIOLA_AGENTS__DEFAULTS__SESSION_TTL_MINUTES: "30"
      VIOLA_TOOLS__PERSISTENCE_VIA_MCP_ONLY: "true"
      VIOLA_CUSTOMER_SERVICE_ONLY: "false"
      VIOLA_OPENAI_COMPAT_TIMEOUT_S: "300"
      VIOLA_STREAM_IDLE_TIMEOUT_S: "180"
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/viola/.viola/portfolio", "--timeout", "600", "--verbose"]
    volumes:
      - agent_data:/home/viola/.viola
    depends_on:
      - api

  web:
    image: ${IMAGE_REGISTRY:-asia-east2-docker.pkg.dev/project-9d21d8d1-183d-4306-8c3/personal-blog}/web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:-https://kenchan0522.blog}
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  # Static bachi-motion app at https://kenchan0522.blog/taiko/
  # Opt-in only: set COMPOSE_PROFILES=taiko so existing
  # `start.sh --prod --pull` deploys (api/agent/web from Artifact
  # Registry) stay unchanged and cannot fail on a missing taiko image.
  #
  # Preferred: build from a sibling checkout pinned to TAIKO_REF.
  # This keeps working after kenchan6666/bachi-motion is private, as
  # long as this machine can `git pull` that repo (deploy key or
  # HTTPS token with repo scope — do not commit the token).
  #   git clone git@github.com:kenchan6666/bachi-motion.git ../bachi-motion
  #   git -C ../bachi-motion checkout "$TAIKO_REF"
  #
  # Later alternative: set TAIKO_IMAGE to a pushed tag and
  # TAIKO_PULL_POLICY=always (or missing):
  #   - GHCR, e.g. ghcr.io/kenchan6666/bachi-motion:<sha>
  #     After the repo is private, `docker login ghcr.io` with a
  #     PAT / fine-grained token that has read:packages, and grant
  #     that identity package read access.
  #   - Same Artifact Registry as api/agent/web
  #     (${IMAGE_REGISTRY}/taiko:<sha>). Reuses AR_TOKEN / start.sh
  #     registry login. Add a build-and-push job when ready; do not
  #     turn it on until the image exists, or `compose pull` will fail.
  taiko:
    profiles: ["taiko"]
    image: ${TAIKO_IMAGE:-bachi-motion:${TAIKO_REF:-a63bf58ef12b25ab19b4297c3fae9f2a9e7d6270}}
    pull_policy: ${TAIKO_PULL_POLICY:-never}
    build:
      context: ${TAIKO_CONTEXT:-../bachi-motion}
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/proxy.inc:/etc/nginx/portfolio/proxy.inc:ro
      - ./deployment/nginx-runtime:/etc/nginx/conf.d
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - while true; do sleep 12h; nginx -s reload; done & exec nginx -g "daemon off;"
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --cert-name site --quiet || true; sleep 12h; done

volumes:
  mongo_data:
  redis_data:
  certbot_www:
  certbot_certs:
  agent_data:
  qdrant_data:
