# Single-VM stack: nginx :80/:443 → Next.js + FastAPI, plus Mongo, Redis, and certbot.
# Preferred: bash deployment/start.sh --prod
# Or: copy deployment/env.example to deployment/.env, then:
#   docker compose -f docker-compose.prod.yml --env-file deployment/.env up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./deployment/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: portfolio
      REDIS_URL: redis://redis:6379/0
      AVATAR_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      - mongo
      - redis

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:-https://kenchan0522.blog}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/proxy.inc:/etc/nginx/portfolio/proxy.inc:ro
      - ./deployment/nginx-runtime:/etc/nginx/conf.d
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - while true; do sleep 12h; nginx -s reload; done & exec nginx -g "daemon off;"
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --cert-name site --quiet || true; sleep 12h; done

volumes:
  mongo_data:
  avatar_data:
  certbot_www:
  certbot_certs:
