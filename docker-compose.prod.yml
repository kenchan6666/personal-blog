# Single-VM stack: nginx :80 → Next.js + FastAPI, plus Mongo and Redis.
# Preferred: bash deployment/start.sh --prod
# Or: copy deployment/env.example to deployment/.env, then:
#   docker compose -f docker-compose.prod.yml --env-file deployment/.env up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./deployment/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: portfolio
      REDIS_URL: redis://redis:6379/0
      AVATAR_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      - mongo
      - redis

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  mongo_data:
  avatar_data:
