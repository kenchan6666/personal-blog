[project]
name = "mcp-portfolio"
version = "0.1.0"
description = "Owner-only MCP tools for the personal portfolio"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
]

[project.scripts]
mcp-portfolio = "mcp_portfolio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_portfolio", "mcp_common"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_common/fragment.json" = "mcp_common/fragment.json"
