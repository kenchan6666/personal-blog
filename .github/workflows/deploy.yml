name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          # Secrets may omit a trailing newline; OpenSSH requires one on the key file.
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /home/ynchanhk/personal-blog
          git pull --ff-only
          # Official prod entrypoint: sequential image builds, existing .env,
          # TLS restore from the Let's Encrypt cert already on the VM.
          bash deployment/start.sh --prod
          docker image prune -f
          curl -fsS --max-time 30 http://127.0.0.1/api/health >/dev/null
          echo "deploy ok"
          REMOTE

      - name: Verify public site
        run: |
          set -euo pipefail
          code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 https://kenchan0522.blog/zh-Hant)"
          echo "https://kenchan0522.blog/zh-Hant -> ${code}"
          test "$code" = "200"
