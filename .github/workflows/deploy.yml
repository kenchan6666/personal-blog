name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          # Secrets may omit a trailing newline; OpenSSH requires one on the key file.
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /home/ynchanhk/personal-blog
          git pull --ff-only
          # Official prod entrypoint: sequential image builds, existing .env,
          # TLS restore from the Let's Encrypt cert already on the VM.
          bash deployment/start.sh --prod
          docker image prune -f
          # After TLS is on, http://127.0.0.1/api/health is a 301. Wait for the
          # public page itself so we don't race Next.js startup (first request
          # after a rebuild can return 500).
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1/zh-Hant || true)"
            echo "local https /zh-Hant try ${i}: ${code:-curl-fail}"
            if [ "${code:-}" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ]
          echo "deploy ok"
          REMOTE

      - name: Verify public site
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://kenchan0522.blog/zh-Hant || true)"
            echo "try ${i}: https://kenchan0522.blog/zh-Hant -> ${code:-curl-fail}"
            if [ "${code:-}" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "public site did not return 200 in time"
          exit 1
