# Pages get a per-request nonce CSP from the Next.js proxy (frontend/src/proxy.ts).
# Anything that comes back without one (/api JSON and media, static files)
# gets this static fallback; an empty value means nginx omits the header.
map $upstream_http_content_security_policy $fallback_csp {
    ""      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # Locations in proxy.inc must not use add_header, or these stop inheriting.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy $fallback_csp always;
    proxy_hide_header X-Powered-By;

    include /etc/nginx/portfolio/proxy.inc;
}
